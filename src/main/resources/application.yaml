spring:
    application:
        name: ruleEngine_server
    config:
        import: optional:file:.env[.properties]

    data:
        redis:
            host: ${REDIS_HOST}
            port: ${REDIS_PORT}
            password: ${REDIS_PASSWORD}
            database: ${REDIS_DATABASE}

mqtt:
    broker-url: ${MQTT_BROKER_URL}
    client-id: ${MQTT_CLIENT_ID}
    username: ${MQTT_USERNAME}
    password: ${MQTT_PASSWORD}

rabbitmq:
    queue:
        # todo : 작명 규칙 논의에 따른 큐 이름 변경
        cultivation-info: "mushmush.cultivation-info.queue"
        sensor-info: "mushmush.sensor-info.queue"